# All paths are relative to the kinase-gap project root.  Absolute paths and
# paths that escape the root are rejected by src/kinase_gap/train.py.
run_name: klifs_finetune_anchors
data: data/processed/klifs_v1
checkpoint_dir: models/runs
log_dir: logs/general

# This must be the genuine anchor-conditioned MOAD checkpoint.  The historical
# local file named pocket_difflinker_fullpocket.ckpt is actually a no-anchor
# checkpoint and is intentionally not referenced here.
init_checkpoint: models/pretrained/pockets_difflinker_full_anchor.ckpt
resume_checkpoint: null
allow_from_scratch: false

train_data_prefix: KLIFS_train.full
val_data_prefix: KLIFS_val.full

seed: 42
# PyTorch 1.11 has no deterministic CUDA scatter_add implementation, which the
# EGNN requires. Keep deterministic kernels enabled where available and log a
# warning whenever PyTorch must use that specific nondeterministic fallback.
deterministic_warn_only: true
accelerator: gpu
devices: 1
precision: 32
num_workers: 0
max_epochs: 1000
batch_size: 32
lr: 2.0e-4

model: egnn_dynamics
nf: 128
n_layers: 6
activation: silu
attention: false
tanh: false
norm_constant: 1.0e-6
inv_sublayers: 2

diffusion_steps: 500
diffusion_noise_schedule: polynomial_2
diffusion_noise_precision: 1.0e-5
diffusion_loss_type: l2

include_charges: false
data_augmentation: false
center_of_mass: fragments
remove_anchors_context: false
inpainting: false

# This is the expected graph mode for the intended PDB-excluded FC checkpoint.
# train.py rejects a conflicting graph_type when checkpoint metadata records it;
# the downloaded checkpoint metadata remains the final authority.
graph_type: FC-10A-4A
sin_embedding: false
normalization_factor: 100
normalize_factors: [1, 4, 10]
aggregation_method: sum
normalization: batch_norm

# Molecular sampling is intentionally disabled during validation by the wrapper;
# these remain model hyperparameters for checkpoint compatibility.
test_epochs: 20
n_stability_samples: 5
log_iterations: null

save_top_k: 3
num_sanity_val_steps: 2
enable_progress_bar: true
log_every_n_steps: 10
gradient_clip_val: 0.0
accumulate_grad_batches: 1
