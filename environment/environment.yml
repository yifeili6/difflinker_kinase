name: kinase-gap
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10.5
  - pip=22.3
  - pytorch=1.11.0
  - cudatoolkit=11.3
  # PyTorch 1.11 requires the iJIT symbols removed from MKL 2024.1+.
  - mkl<2024.1
  - pytorch-lightning=1.6.3
  - torchmetrics=0.9.3
  - numpy=1.22.4
  - pandas=1.4.4
  - scipy=1.8.1
  - scikit-learn=1.1.2
  - networkx=2.8.6
  - rdkit=2022.03.5
  - biopython=1.79
  - openbabel=3.1.1
  - pyyaml=6.0
  - tqdm=4.64.1
  - joblib=1.2.0
  - matplotlib=3.5.3
  - imageio=2.22.0
  - pillow=9.2.0
  - wandb=0.13.3
  - conda-pack=0.7.1
  - pytest=7.1.3
# The only pip-distributed dependency is installed offline from the hash-pinned
# wheel listed in environment/pip-requirements.txt by build_environment.sh.
